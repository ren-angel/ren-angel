# ✨ Builds the README images (stats, top languages, snake, achievements)
#    inside this repo, so they never break when a public server goes down.
#
#    Runs every day, and you can also run it by hand:
#    Actions tab → "Update profile cards" → Run workflow

name: Update profile cards

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 03:00 in São Paulo (06:00 UTC)
  workflow_dispatch:        # "Run workflow" button

jobs:
  # ──────────────── stats + languages + snake ────────────────
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 📊 Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&border_radius=12&title_color=00bfbf&icon_color=8a7dff&text_color=8b949e&bg_color=00000000&custom_title=My%20GitHub%20Vibes
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🌈 Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&border_radius=12&title_color=00bfbf&text_color=8b949e&bg_color=00000000&custom_title=Languages%20I%20Speak
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?color_snake=#00bfbf&color_dots=#161b22,#0b4f55,#00808a,#00b3b3,#5ff5f0
            profile/snake-light.svg?color_snake=#8a7dff&color_dots=#ebedf0,#b8f2f0,#66dcd8,#00bfbf,#00808a

      - name: 💾 Save the new images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "✨ update profile cards"
          git push

  
  # ──────────────── achievements ────────────────
  achievements:
    needs: cards
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🏆 Achievements
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/achievements.svg
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0

          plugins_errors_fatal: yes
